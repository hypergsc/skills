name: Prepare catalog release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - run: python3 scripts/check_transcript.py --self-test
      - run: git archive --format=zip --output=/tmp/hypergsc-skills.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hypergsc-skills
          path: /tmp/hypergsc-skills.zip
